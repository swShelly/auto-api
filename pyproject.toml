[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-api"
version = "0.1.0"
description = "自动化测试框架 - API 接口测试"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    {name = "Jessie", email = "jessie@example.com"}
]
keywords = ["automation", "testing", "api", "pytest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "requests>=2.28.0",
    "pytest>=7.0.0",
    "PyYAML>=6.0",
    "pytest-html>=3.2.0",
    "allure-pytest>=2.12.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pytest-cov>=4.0.0",
    "coverage>=7.0.0",
    "safety>=2.0.0",
    "bandit>=1.7.0",
    "pip-audit>=2.0.0",
    "wheel>=0.42.0",
    "twine>=5.0.0",
    "build>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/auto-api"
Repository = "https://github.com/yourusername/auto-api.git"
Documentation = "https://github.com/yourusername/auto-api/wiki"
Issues = "https://github.com/yourusername/auto-api/issues"

[tool.setuptools]
packages = ["core"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = ["core"]

[tool.mypy]
python_version = "3.9"
check_untyped_defs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["testcases"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
env = []

[tool.coverage.run]
source = ["core"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
