name: 持续交付流水线（构建→发布→部署→监控）

# 触发条件
on:
  push:
    branches: [main, master, develop]
    tags: ['v*']  # 发版触发
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # 手动触发
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

# 全局环境变量
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: auto-api

# 工作流
jobs:
  # ==================== 阶段 1: 代码质量检查 ====================
  # 代码质量检查
  lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
      
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 安装 ruff
        run: pip install ruff
      
      - name: 运行 Lint 检查
        run: ruff check .
      
      - name: 运行代码格式化检查
        run: ruff format --check .

  # 类型检查
  type-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
      
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 安装 mypy
        run: pip install mypy types-requests
      
      - name: 运行类型检查
        run: mypy .
        continue-on-error: true  # 类型检查失败不阻止合并

  # ==================== 阶段 2: 安全扫描 ====================
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
      
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 安装依赖扫描工具
        run: pip install safety bandit pip-audit requests
      
      - name: 依赖安全检查（safety）
        run: safety check --json > safety-report.json
        continue-on-error: true
      
      - name: 依赖安全检查（pip-audit）
        run: pip-audit --desc > pip-audit-report.txt
        continue-on-error: true
      
      - name: 代码安全检查（bandit）
        run: bandit -r . -f json -o bandit-report.json
        continue-on-error: true
      
      - name: 上传安全扫描报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            safety-report.json
            pip-audit-report.txt
            bandit-report.json

  # ==================== 阶段 3: 测试 & 覆盖率 ====================
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
      
      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: 缓存 pip 依赖
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov allure-pytest
      
      - name: 运行测试 & 收集覆盖率
        run: |
          pytest -v \
            --tb=short \
            --cov=core \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term \
            --alluredir=allure-results
      
      - name: 上传覆盖率到 Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: coverage-${{ matrix.python-version }}
          fail_ci_if_error: false
      
      - name: 生成测试报告（Allure）
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 20
      
      - name: 上传测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.python-version }}
          path: |
            reports/
            htmlcov/

  # ==================== 阶段 4: 构建 ====================
  build:
    needs: [lint, type-check, security-scan, test]
    runs-on: ubuntu-latest
    if: success()
    
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
      
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 安装构建工具
        run: pip install build twine wheel
      
      - name: 构建 wheel & tar.gz
        run: python -m build
      
      - name: 验证构建产物
        run: twine check dist/*
      
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      
      - name: 登录 Docker Registry
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main')
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 构建 & 推送 Docker 镜像
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main')
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}:latest
            ${{ env.REGISTRY }}/${{ github.repository }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}:${{ github.ref_name }}

  # ==================== 阶段 5: 发布 (仅限 tag & main) ====================
  publish:
    needs: build
    runs-on: ubuntu-latest
    # 仅在标签或主分支上发布
    if: success() && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
      
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      
      - name: 安装 Twine
        run: pip install twine
      
      - name: 发布到 PyPI (生产)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TWINE_REPOSITORY: pypi
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/* --skip-existing
      
      - name: 发布到 TestPyPI (测试)
        if: github.ref == 'refs/heads/main'
        env:
          TWINE_REPOSITORY: testpypi
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TESTPYPI_API_TOKEN }}
        run: twine upload dist/* --skip-existing
        continue-on-error: true

  # ==================== 阶段 6: 部署 ====================
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    if: success() && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    
    strategy:
      matrix:
        environment: [staging, production]
      max-parallel: 1  # 串行部署，避免并发问题
      fail-fast: false
    
    environment:
      name: ${{ matrix.environment }}
      url: https://${{ matrix.environment }}-api.example.com/health
    
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
      
      - name: 部署到 Staging
        if: matrix.environment == 'staging'
        run: |
          echo "🚀 部署到 Staging 环境..."
          echo "部署命令示例：ssh deploy@staging-server 'docker pull ${{ env.REGISTRY }}/${{ github.repository }}:${{ github.ref_name }} && docker-compose up -d'"
          # 实际部署命令根据你的基础设施调整
      
      - name: 部署到 Production
        if: matrix.environment == 'production' && startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "🚀 部署到 Production 环境..."
          echo "部署命令示例：ssh deploy@prod-server 'docker pull ${{ env.REGISTRY }}/${{ github.repository }}:${{ github.ref_name }} && docker-compose up -d'"
          # 实际部署命令根据你的基础设施调整
      
      - name: 健康检查
        run: |
          echo "🏥 执行健康检查..."
          sleep 30  # 等待服务启动
          curl -f https://${{ matrix.environment }}-api.example.com/health || exit 1
        continue-on-error: true
      
      - name: 烟雾测试
        if: matrix.environment == 'staging'
        run: |
          echo "🧪 运行烟雾测试..."
          # 可以这里运行一些关键路径的测试

  # ==================== 阶段 7: 监控 & 通知 ====================
  notify:
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, type-check, security-scan, test, build, publish, deploy]
    
    steps:
      - name: 工作流成功通知
        if: success()
        run: |
          echo "✅ CI/CD 流水线执行成功！"
          echo "📊 阶段完成："
          echo "  ✓ Lint 检查"
          echo "  ✓ 类型检查"
          echo "  ✓ 安全扫描"
          echo "  ✓ 测试 & 覆盖率"
          echo "  ✓ 构建"
          echo "  ✓ 发布"
          echo "  ✓ 部署"
      
      - name: 工作流失败通知
        if: failure()
        run: |
          echo "❌ CI/CD 流水线出现失败！"
          echo "请检查上面的详细日志"
          exit 1
      
      - name: 生成工作流摘要
        if: always()
        run: |
          echo "## 🔄 CI/CD 流水线执行摘要" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 触发信息" >> $GITHUB_STEP_SUMMARY
          echo "- **分支**: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- **提交**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **作者**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 流水线状态" >> $GITHUB_STEP_SUMMARY
          echo "| 阶段 | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Type Check | ${{ needs.type-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Publish | ${{ needs.publish.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy | ${{ needs.deploy.result }} |" >> $GITHUB_STEP_SUMMARY
