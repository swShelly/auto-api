name: 接口自动化测试

# 触发条件
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# 工作流
jobs:
  test:
    runs-on: ubuntu-latest  # 运行环境
    
    steps:
      # 1. 拉取代码
      - name: 拉取代码
        uses: actions/checkout@v4
      
      # 2. 设置 Python 环境
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      # 3. 安装依赖
      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install pytest allure-pytest
      
      # 4. 运行测试
      - name: 运行测试
        run: pytest -v --tb=short
      
      # 5. 上传测试报告（失败时）
      - name: 上传测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: reports/
      
      # 6. 运行 Stripe 测试（可选）
      - name: 运行 Stripe 测试
        run: pytest -v testcases/test_stripe.py || echo "Stripe tests skipped"
