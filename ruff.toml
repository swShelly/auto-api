# Ruff - 快速 Python Linter

# 行长度
line-length = 120

# 目标版本
target-version = "py311"

# 启用规则
[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]

# 忽略规则
ignore = [
    "E501",  # 行太长（由 ruff 处理）
    "B008",  # 函数默认参数不要执行
]

# 修复规则
[lint.fixable]
all = true

[lint.per-file-ignores]
"__init__.py" = ["F401"]
